<text x="300.0" y="12765.0" font-family="Helvetica, Arial, sans-serif" font-size="225" fill="#111" text-anchor="start" font-weight="bold">Dachgeschoss — Variante 2 mit Treppe ins Atelier</text>
<text x="300.0" y="13095.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">Entwurfsschema · Norden oben · Maße in m · Schnitt Z = +3,00 m · Z = 0 = EG-FFB = 10,670 m ü. NN</text>
<text x="300.0" y="13345.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal"></text>
<text x="300.0" y="13595.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">TREPPE: 13 Steigungen à 191.5 mm, Auftritt 230 mm, Schrittmaß 613 mm. Steighöhe DG-FFB 2,93 → Atelierboden 5,42 m = 2490 mm.</text>
<text x="300.0" y="13845.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">Lauflänge 2,76 m, Rohbaubreite 1,00 m (nutzbar rund 0,90 m). 13 Steigungen sind die steilste Teilung, die DIN 18065 für Wohngebäude bis zwei Wohnungen zulässt (s ≤ 20 cm).</text>
<text x="300.0" y="14095.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal"></text>
<text x="300.0" y="14345.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">WARUM DER LAUF NACH NORDEN GEHT: Die Kopffreiheit über der Lauflinie beträgt am Austritt 2,32 m und steigt nach Süden auf über 5 m. Der Austritt liegt bei Y 6,00 m — dort hat das Atelier 2,32 m lichte Höhe, 30 cm weiter nördlich nur noch 2,02 m.</text>
<text x="300.0" y="14595.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal"></text>
<text x="300.0" y="14845.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">WAS ES KOSTET: Das Elternzimmer verliert den Streifen X 4,71–5,82 m auf Y 4,54–6,12 m = 1,75 m² und behält 25,5 m² (statt 27,2 m² mit Balkon). Kind 2, Kind 1 und Bad bleiben unberührt — die Treppe endet bei X 5,71 m, gut 1,10 m vor der Wand zu Kind 2.</text>
<text x="300.0" y="15095.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">Die Elterntür wandert 0,46 m nach Osten; östlich der Treppe bleibt der Flur 1,01 m breit. Zum Kamin bleiben 0,51 m.</text>
<text x="300.0" y="15345.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal"></text>
<text x="300.0" y="15595.0" font-family="Helvetica, Arial, sans-serif" font-size="128" fill="#444" text-anchor="start" font-weight="normal">NICHT GEPRÜFT: Tragwerk (Auswechslung der Kehlbalken für die Deckenöffnung, Auflager der Treppe), Brandschutz, Geländer und Handlauf, Wandaufbauten und Anschläge.</text>
</svg>
